# Replaces the e2fsprogs package's file, whose setting is the first line below.
# The data partition is checked at boot before the system log runs, so e2fsck
# keeps its report in /tmp, and /etc/init.d/fsck_report hands it to the log.
# This file is in the image rather than written on the first boot, as that boot
# checks the partition too (see 11-data_partition).
[options]
broken_system_clock = true
log_dir = /tmp
log_filename = e2fsck-%N.log
